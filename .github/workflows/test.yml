name: Test

on:
  push:
  pull_request:

jobs:
  deterministic-browser-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run result -- 23
      - name: Verify Gate 1 frozen receipt stayed frozen
        run: git diff --exit-code -- results/seed23.json
      - run: npm run gate2 -- 23
